# English UI with the date/time display format customary in the Czech Republic.
# Times are shown in the application time zone (Europe/Prague).
en:
  date:
    formats:
      default: "%-d. %-m. %Y"
  time:
    formats:
      default: "%-d. %-m. %Y %H:%M"
  activerecord:
    attributes:
      equipment:
        turnaround_minutes: "Turnaround"
        image_url: "Image URL"
      reservation:
        customer_name: "Name"
        customer_email: "Email"
        customer_phone: "Phone"
        start_date: "Start"
        end_date: "End"
    errors:
      models:
        equipment:
          attributes:
            capacity:
              in: "must be between 1 and 100 units"
              not_a_number: "must be a whole number"
              not_an_integer: "must be a whole number"
            turnaround_minutes:
              in: "must be between 0 and 1440 minutes"
              not_a_number: "must be a whole number of minutes"
              not_an_integer: "must be a whole number of minutes"
            image_url:
              not_https_url: "must be an https:// link to an image"
        reservation:
          attributes:
            base:
              busy: "The system is busy right now, please try again."
              not_editable: "Finished or cancelled reservations cannot be changed"
              over_capacity: "Not available: all %{capacity} units are taken at some point between %{start} and %{end} (each rental also blocks %{turnaround} min for inspection after it ends)."
            start_date:
              already_started: "cannot be changed once the reservation has started"
              not_in_future: "must be in the future"
              too_far_ahead: "can be at most 1 year ahead"
              not_on_time_step: "must be on a 15-minute step (:00, :15, :30 or :45)"
            end_date:
              not_after_start: "must be after the start"
              not_in_future: "must be in the future"
              duration_too_short: "must be at least 1 hour after the start"
              duration_too_long: "must be at most 30 days after the start"
              not_on_time_step: "must be on a 15-minute step (:00, :15, :30 or :45)"
